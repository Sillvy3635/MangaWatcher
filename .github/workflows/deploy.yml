name: Deploy MangaWatcher Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mangawatcher-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify public API origin
        env:
          MW_API_ORIGIN: ${{ vars.MW_API_ORIGIN }}
        run: |
          test -n "$MW_API_ORIGIN"
          [[ "$MW_API_ORIGIN" == https://* ]]
          [[ "$MW_API_ORIGIN" != */ ]]
      - name: Install and test frontend
        run: |
          npm ci --prefix frontend
          npm run lint --prefix frontend
      - name: Build Pages site
        env:
          VITE_API_MODE: pages
          VITE_API_BASE_URL: ${{ vars.MW_API_ORIGIN }}
          VITE_BASE_PATH: /MangaWatcher/
        run: npm run build --prefix frontend
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
