name: Update manga metadata
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      test_discord:
        description: Send a labelled Discord connection test (no fake chapter)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: mangawatcher-metadata-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run worker tests
        run: python -m unittest discover -s tests -v
      - name: Check authorized metadata sources
        env:
          MW_DATA_OWNER: Sillvy3635
          MW_DATA_REPO: MangaWatcher-Data
          MW_DATA_PATH: mangawatcher.json
          MW_DATA_BRANCH: main
          MW_DATA_TOKEN: ${{ secrets.MW_DATA_TOKEN }}
          MW_DISCORD_WEBHOOK_URL: ${{ secrets.MW_DISCORD_WEBHOOK_URL }}
          MW_DISCORD_TEST: ${{ inputs.test_discord }}
        run: python cloud_worker.py
